# CI is the enforcement layer (architecture.md › Công cụ cưỡng chế quy tắc).
# Required status checks: `CI OK` (this file) and `PR conventions` (pr.yml).
name: CI

# Paused to save Actions minutes: runs only for PRs into master (task PRs target develop).
on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its old run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Shared files (CI, compose, scripts, editor settings) re-run both sides.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="qloud_backend/ qloud_frontend/"
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          echo "$files"
          shared='^(\.github/workflows/|scripts/|docker-compose\.yml|infra/|\.editorconfig$)'
          echo "backend=$(echo "$files" | grep -qE "^qloud_backend/|$shared" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The FE API types are generated from the backend schema.
          echo "frontend=$(echo "$files" | grep -qE "^qloud_frontend/|^qloud_backend/openapi\.yaml$|$shared" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qloud_backend
    env:
      # LocalStack (S3 tests) needs the token. Dependabot PRs get no Actions secrets, so
      # the placeholder makes LocalStack exit there until the token is also a Dependabot
      # secret (#95).
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN || 'not-used' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Start Postgres, Redis and LocalStack
        working-directory: .
        run: docker compose up -d --wait postgres redis localstack
      - name: Build LGPL-only thumbnail decoder
        working-directory: .
        run: python3 scripts/build_ffmpeg.py
      - run: uv sync --frozen
      - name: Convention script tests
        run: python3 -m unittest discover -s ../scripts/tests
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Deploy checks with production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          APP_DOMAIN: qloud.example.com
          DATABASE_URL: postgres://qloud:qloud@localhost:5432/qloud
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          # Placeholder: production settings refuse an empty or Cloudflare test key.
          TURNSTILE_SECRET_KEY: ci-placeholder-not-a-real-key
          MODERATION_EMAIL: moderation@example.com
          TURNSTILE_SITE_KEY: ci-placeholder-site-key
          S3_BUCKET: qloud-ci
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
        run: |
          DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))') \
            uv run python manage.py check --deploy --fail-level WARNING
      - run: uv run pytest --cov
      - name: Dependency licenses
        run: uv run --with pip-licenses pip-licenses --from=mixed --format=json | python3 ../scripts/check_licenses.py pip

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qloud_frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: qloud_frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: qloud_frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match qloud_backend/openapi.yaml
        run: pnpm api:generate && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Dependency licenses
        run: pnpm licenses list --json | python3 ../scripts/check_licenses.py pnpm

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN || 'not-used' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: qloud_frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: qloud_frontend/pnpm-lock.yaml
      - name: Start Postgres, Redis, Mailpit and LocalStack
        # Mailpit receives the emails the auth flows read their links from; LocalStack
        # holds the uploads (bucket qloud-e2e, CORS for vite preview).
        run: docker compose up -d --wait postgres redis mailpit localstack
      - name: Build LGPL-only thumbnail decoder
        working-directory: .
        run: python3 scripts/build_ffmpeg.py
      - run: uv sync --frozen
        working-directory: qloud_backend
      - run: pnpm install --frozen-lockfile
        working-directory: qloud_frontend
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('qloud_frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: qloud_frontend
      - run: pnpm test:e2e
        working-directory: qloud_frontend
      - name: Preview media in development StrictMode
        run: pnpm exec playwright test e2e/preview.spec.ts -g 'video streams|audio uses|MP4 thumbnails' --output test-results-dev
        working-directory: qloud_frontend
        env:
          PREVIEW_DEV: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-dev
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            qloud_frontend/playwright-report
            qloud_frontend/test-results
            qloud_frontend/playwright-report-dev
            qloud_frontend/test-results-dev
          retention-days: 7

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="--log-opts=--all"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="--log-opts=$BASE..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner "$range"

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, backend, frontend, e2e, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended with: $result"; exit 1 ;;
            esac
          done
