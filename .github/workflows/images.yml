# Production images (infra/docker/Dockerfile, qloud_docs/deploy.md).
# Pull requests that touch the build only build; pushes to master build and push to GHCR:
#   ghcr.io/<owner>/qloud-backend and ghcr.io/<owner>/qloud-web, tags `sha-<commit>` and `master`.
name: Images

on:
  pull_request:
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - infra/docker/**
      - infra/nginx/**
      - scripts/build_ffmpeg.py
      - qloud_backend/pyproject.toml
      - qloud_backend/uv.lock
      - qloud_backend/config/gunicorn.py
      - qloud_frontend/package.json
      - qloud_frontend/pnpm-lock.yaml
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [backend, web]
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/qloud-${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=master,enable=${{ env.PUSH }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
