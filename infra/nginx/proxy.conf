# Upstream request to gunicorn. The site is only served over HTTPS (TLS ends at the host's nginx),
# so the scheme is fixed for Django's SECURE_PROXY_SSL_HEADER. CF-Connecting-IP, the client IP that
# Django reads (TRUSTED_CLIENT_IP_HEADER), passes through unchanged from the host's nginx.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 90s;
proxy_send_timeout 90s;
