# Qloud's own nginx: plain HTTP, routes the SPA, /static/ and the API (ADR-0014, qloud_docs/deploy.md).
# The host's nginx terminates TLS (Cloudflare Origin Certificate), admits Cloudflare only and
# forwards here on 127.0.0.1, so this server trusts the headers it receives.

# Docker's DNS. `resolve` re-reads the api address: a deploy recreates api with a new IP
# while web keeps running, and a name resolved once at startup would then answer 502.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream qloud_api {
    zone qloud_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # File bytes go straight to S3 (ADR-0003); only JSON and admin forms come through here.
    client_max_body_size 10m;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://qloud_api;
        include /etc/nginx/qloud/proxy.conf;
    }

    location /admin/ {
        proxy_pass http://qloud_api;
        include /etc/nginx/qloud/proxy.conf;
    }

    # Django admin and DRF assets (collectstatic).
    location /static/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/qloud/security-headers.conf;
    }

    # Vite output with content hashes in the file names.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/qloud/security-headers.conf;
    }

    # Every SPA route serves index.html; it and other unhashed files are revalidated each time.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/qloud/security-headers.conf;
    }
}

# Container health check only; the port is not published.
server {
    listen 127.0.0.1:8081;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }
}
