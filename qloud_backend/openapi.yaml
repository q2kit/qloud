          description: No such resource, or insufficient access.
  /api/v1/shares/{share_id}:
    patch:
      operationId: shares_update
      parameters:
      - in: path
        name: share_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateShareRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
    delete:
      operationId: shares_destroy
      parameters:
      - in: path
        name: share_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/trash:
    get:
      operationId: trash_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrashNodeList'
          description: ''
  /api/v1/trash/delete:
    post:
      operationId: trash_delete
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashSelectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/trash/empty:
    post:
      operationId: trash_empty
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/trash/restore:
    post:
      operationId: trash_restore
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashSelectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/uploads:
    get:
      operationId: uploads_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - active
          - completed
          - aborted
          - expired
          type: string
          minLength: 1
        description: |-
          * `active` - Active
          * `completed` - Completed
          * `aborted` - Aborted
          * `expired` - Expired
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUploadSessionList'
          description: ''
    post:
      operationId: uploads_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, or the parent is not a folder.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`email_not_verified`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such folder, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict` (with `on_conflict=fail`).'
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`file_too_large` or `quota_exceeded`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`storage_unavailable`.'
  /api/v1/uploads/{upload_id}:
    get:
      operationId: uploads_retrieve
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such upload, or not yours.
    delete:
      operationId: uploads_destroy
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such upload, or not yours.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_closed`: already completed.'
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: uploads_complete
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_incomplete`: parts missing or size mismatch.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such upload, or not yours.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_closed`, or `target_unavailable` (the upload is cancelled).'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_closed` (409) or `upload_expired` (410).'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`storage_unavailable`.'
  /api/v1/uploads/{upload_id}/parts:
    post:
      operationId: uploads_parts
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUrlsRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrls'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`invalid_part`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such upload, or not yours.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_closed` (409) or `upload_expired` (410).'
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`upload_closed` (409) or `upload_expired` (410).'
components:
  schemas:
    Breadcrumb:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Capabilities:
      type: object
      properties:
        can_edit:
          type: boolean
          description: Rename, move; create inside a folder.
        can_trash:
          type: boolean
        can_share:
          type: boolean
      required:
      - can_edit
      - can_share
      - can_trash
    CreateFolderRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        on_conflict:
          allOf:
          - $ref: '#/components/schemas/FolderConflictEnum'
          default: fail
      required:
      - name
      - parent_id
    CreateLinkRequest:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          nullable: true
    CreateShareRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ShareRoleEnum'
      required:
      - email
      - role
    CreateUploadRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 0
        mime_type:
          type: string
          default: ''
          maxLength: 255
        fingerprint:
          type: string
          minLength: 1
          maxLength: 128
        on_conflict:
          allOf:
          - $ref: '#/components/schemas/OnConflictEnum'
          default: fail
      required:
      - filename
      - fingerprint
      - parent_id
      - size
    DownloadLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned GET URL; send the browser straight to it.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    Error:
      type: object
      description: Schema of every error response, for `@extend_schema(responses=...)`.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable identifier, e.g. `name_conflict`.
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: '`fields` for `validation_error`.'
      required:
      - code
      - details
      - message
    FolderConflictEnum:
      enum:
      - fail
      - rename
      - reuse
      type: string
      description: |-
        * `fail` - fail
        * `rename` - rename
        * `reuse` - reuse
    Grantee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          readOnly: true
          title: Tên hiển thị
      required:
      - display_name
      - email
      - id
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          type: object
          additionalProperties:
            enum:
            - ok
            - error
            type: string
            description: |-
              * `ok` - ok
              * `error` - error
      required:
      - checks
      - status
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    KindEnum:
      enum:
      - folder
      - file
      type: string
      description: |-
        * `folder` - Folder
        * `file` - File
    LocaleEnum:
      enum:
      - vi
      - en
      type: string
      description: |-
        * `vi` - Tiếng Việt
        * `en` - Tiếng Anh
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          title: Tên hiển thị
          maxLength: 100
        avatar_url:
          type: string
          readOnly: true
          nullable: true
          title: URL ảnh đại diện
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          title: Ngôn ngữ
        theme:
          allOf:
          - $ref: '#/components/schemas/ThemeEnum'
