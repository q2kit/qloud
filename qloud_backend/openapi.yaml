components:
  schemas:
    Actor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
          description: Editors and the owner only.
      required:
      - display_name
      - id
    ActorKindEnum:
      enum:
      - user
      - system
      - moderator
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `moderator` - Moderator
    AuditEvent:
      type: object
      description: |-
        One activity row. Emails appear for editors and the owner only; a folder the
        reader cannot open appears without id or name.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditEventActionEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_kind:
          allOf:
          - $ref: '#/components/schemas/ActorKindEnum'
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
          readOnly: true
        node:
          allOf:
          - $ref: '#/components/schemas/EventNode'
          readOnly: true
        metadata:
          type: object
          additionalProperties: {}
          description: Per action; see api.md.
          readOnly: true
      required:
      - action
      - actor
      - actor_kind
      - created_at
      - id
      - metadata
      - node
    AuditEventActionEnum:
      enum:
      - node.create
      - node.upload
      - node.rename
      - node.move
      - node.trash
      - node.restore
      - node.purge
      - version.create
      - version.restore
      - version.delete
      - version.expire
      - version.lock
      - version.unlock
      - share.add
      - share.role_change
      - share.remove
      - link.create
      - link.revoke
      type: string
      description: |-
        * `node.create` - Node Create
        * `node.upload` - Node Upload
        * `node.rename` - Node Rename
        * `node.move` - Node Move
        * `node.trash` - Node Trash
        * `node.restore` - Node Restore
        * `node.purge` - Node Purge
        * `version.create` - Version Create
        * `version.restore` - Version Restore
        * `version.delete` - Version Delete
        * `version.expire` - Version Expire
        * `version.lock` - Version Lock
        * `version.unlock` - Version Unlock
        * `share.add` - Share Add
        * `share.role_change` - Share Role Change
        * `share.remove` - Share Remove
        * `link.create` - Link Create
        * `link.revoke` - Link Revoke
    Breadcrumb:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Capabilities:
      type: object
      properties:
        can_edit:
          type: boolean
          description: Rename, move; create inside a folder.
        can_trash:
          type: boolean
        can_share:
          type: boolean
        can_delete_versions:
          type: boolean
      required:
      - can_delete_versions
      - can_edit
      - can_share
      - can_trash
    CreateFolderRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        on_conflict:
          allOf:
          - $ref: '#/components/schemas/FolderConflictEnum'
          default: fail
      required:
      - name
      - parent_id
    CreateLinkRequest:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          nullable: true
    CreateReportRequest:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReasonEnum'
        message:
          type: string
          maxLength: 2000
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        turnstile_token:
          type: string
          writeOnly: true
          maxLength: 2048
      required:
      - node_id
      - reason
    CreateShareRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ShareRoleEnum'
      required:
      - email
      - role
    CreateUploadRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
        target_node_id:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 0
        mime_type:
          type: string
          default: ''
          maxLength: 255
        fingerprint:
          type: string
          minLength: 1
          maxLength: 128
        on_conflict:
          allOf:
          - $ref: '#/components/schemas/OnConflictEnum'
          default: fail
      required:
      - filename
      - fingerprint
      - parent_id
      - size
    DownloadLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned GET URL; send the browser straight to it.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    Error:
      type: object
      description: Schema of every error response, for `@extend_schema(responses=...)`.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable identifier, e.g. `name_conflict`.
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: '`fields` for `validation_error`.'
      required:
      - code
      - details
      - message
    EventNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Null once the node is deleted.
        name:
          type: string
        kind:
          type: string
      required:
      - id
      - kind
      - name
    FileVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version_number:
          type: integer
          readOnly: true
        size:
          type: integer
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        original_name:
          type: string
          readOnly: true
