      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShareList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
    post:
      operationId: nodes_shares_create
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: share_exists
  /api/v1/nodes/move:
    post:
      operationId: nodes_move
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/nodes/trash:
    post:
      operationId: nodes_trash
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashSelectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/public/links/{token}:
    get:
      operationId: public_links_retrieve
      parameters:
      - in: query
        name: node_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNodeDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/public/links/{token}/children:
    get:
      operationId: public_links_children_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - in: query
        name: folder_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicNodeList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/public/links/{token}/download:
    get:
      operationId: public_links_download_retrieve
      parameters:
      - in: query
        name: node_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/public/links/{token}/preview:
    get:
      operationId: public_links_preview_retrieve
      parameters:
      - in: query
        name: node_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/recent:
    get:
      operationId: recent_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Newest updated files first; other orderings are not supported.
        schema:
          type: string
          enum:
          - -updated_at
          default: -updated_at
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 100.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNodeList'
          description: ''
  /api/v1/shared-with-me:
    get:
      operationId: shared_with_me_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSharedNodeList'
          description: ''
        '400':
          content:
            application/json:
              schema:
