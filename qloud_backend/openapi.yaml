openapi: 3.0.3
info:
  title: Qloud API
  version: 1.0.0
paths:
  /api/v1/config:
    get:
      operationId: config_retrieve
      description: |-
        Runtime settings the SPA needs before anyone signs in.

        Served by the backend so the Turnstile site key always matches the secret
        the server verifies with, without rebuilding the frontend.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/folders:
    post:
      operationId: folders_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/links/{link_id}:
    delete:
      operationId: links_destroy
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/storage:
    get:
      operationId: me_storage_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUsage'
          description: ''
  /api/v1/me/storage/largest:
    get:
      operationId: me_storage_largest_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Largest files first; other orderings are not supported.
        schema:
          type: string
          enum:
          - -size
          default: -size
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNodeList'
          description: ''
  /api/v1/moderation/reports:
    get:
      operationId: moderation_reports_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: node_uuid
        schema:
          type: string
          format: uuid
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - open
          - actioned
          - dismissed
          type: string
          minLength: 1
        description: |-
          * `open` - Open
          * `actioned` - Actioned
          * `dismissed` - Dismissed
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/moderation/reports/{report_id}:
    get:
      operationId: moderation_reports_retrieve
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/moderation/reports/{report_id}/resolve:
    post:
      operationId: moderation_reports_resolve
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReportRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/nodes/{node_id}:
    get:
      operationId: nodes_retrieve
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
    patch:
      operationId: nodes_rename
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRenameRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/nodes/{node_id}/activity:
    get:
      operationId: nodes_activity_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/children:
    get:
      operationId: nodes_children_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNodeList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/download:
    get:
      operationId: nodes_download
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_a_file`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/links:
    get:
      operationId: nodes_links_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShareLinkList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
    post:
      operationId: nodes_links_create
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/nodes/{node_id}/preview:
    get:
      operationId: nodes_preview
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: trashed_thumbnail
        schema:
          type: boolean
          default: false
        description: Owner-only thumbnail of a trashed file; never returns source
          URLs.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid query or `not_a_file`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/shares:
    get:
      operationId: nodes_shares_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: include_inherited
        schema:
          type: boolean
        description: Also list grants on ancestor folders the caller can see (`node_id`
          tells them apart).
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShareList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
    post:
      operationId: nodes_shares_create
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: share_exists
  /api/v1/nodes/{node_id}/versions:
    get:
      operationId: versions_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFileVersionList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/versions/{version_id}:
    patch:
      operationId: versions_update
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVersionRetentionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
    delete:
      operationId: versions_delete
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`current_version`: the selected version is current.'
  /api/v1/nodes/{node_id}/versions/{version_id}/download:
    get:
      operationId: versions_download
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/versions/{version_id}/restore:
    post:
      operationId: versions_restore
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: version_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`current_version`: the selected version is current.'
  /api/v1/nodes/move:
    post:
      operationId: nodes_move
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/nodes/trash:
    post:
      operationId: nodes_trash
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashSelectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/public/links/{token}:
    get:
      operationId: public_links_retrieve
      parameters:
      - in: query
        name: node_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNodeDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/public/links/{token}/children:
    get:
      operationId: public_links_children_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - in: query
        name: folder_id
        schema:
          type: string
          format: uuid
        description: Defaults to the shared root.
      - name: ordering
        required: false
