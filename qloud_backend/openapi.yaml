openapi: 3.0.3
info:
  title: Qloud API
  version: 1.0.0
paths:
  /api/v1/config:
    get:
      operationId: config_retrieve
      description: |-
        Runtime settings the SPA needs before anyone signs in.

        Served by the backend so the Turnstile site key always matches the secret
        the server verifies with, without rebuilding the frontend.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/folders:
    post:
      operationId: folders_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/links/{link_id}:
    delete:
      operationId: links_destroy
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/nodes/{node_id}:
    get:
      operationId: nodes_retrieve
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
    patch:
      operationId: nodes_rename
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRenameRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/nodes/{node_id}/children:
    get:
      operationId: nodes_children_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNodeList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/download:
    get:
      operationId: nodes_download
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`not_a_file`.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/links:
    get:
      operationId: nodes_links_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShareLinkList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
    post:
      operationId: nodes_links_create
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input, recipient or root folder.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such resource, or insufficient access.
  /api/v1/nodes/{node_id}/preview:
    get:
      operationId: nodes_preview
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: trashed_thumbnail
        schema:
          type: boolean
          default: false
        description: Owner-only thumbnail of a trashed file; never returns source
          URLs.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewLink'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid query or `not_a_file`.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/{node_id}/shares:
    get:
      operationId: nodes_shares_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: node_id
