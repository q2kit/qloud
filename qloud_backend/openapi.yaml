openapi: 3.0.3
info:
  title: Qloud API
  version: 1.0.0
paths:
  /api/v1/config:
    get:
      operationId: config_retrieve
      description: |-
        Runtime settings the SPA needs before anyone signs in.

        Served by the backend so the Turnstile site key always matches the secret
        the server verifies with, without rebuilding the frontend.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
          description: ''
  /api/v1/folders:
    post:
      operationId: folders_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_partial_update
      description: The signed-in user's profile and preferences (S-13).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/nodes/{node_id}:
    get:
      operationId: nodes_retrieve
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
    patch:
      operationId: nodes_rename
      parameters:
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRenameRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
  /api/v1/nodes/{node_id}/children:
    get:
      operationId: nodes_children_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: Opaque value from `next` or `previous`.
        schema:
          type: string
      - in: path
        name: node_id
        schema:
          type: string
          format: uuid
        required: true
      - name: ordering
        required: false
        in: query
        description: Folders always come before files.
        schema:
          type: string
          enum:
          - name
          - -name
          - updated_at
          - -updated_at
          - size
          - -size
          default: name
      - name: page_size
        required: false
        in: query
        description: Items per page, at most 200.
        schema:
          type: integer
          default: 50
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNodeList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
  /api/v1/nodes/move:
    post:
      operationId: nodes_move
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid input or operation.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: No such node, or no access to it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`name_conflict`.'
components:
  schemas:
    Breadcrumb:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Capabilities:
      type: object
      properties:
        can_edit:
          type: boolean
          description: Rename, move; create inside a folder.
        can_trash:
          type: boolean
        can_share:
          type: boolean
      required:
      - can_edit
      - can_share
      - can_trash
    CreateFolderRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
      - parent_id
    Error:
      type: object
      description: Schema of every error response, for `@extend_schema(responses=...)`.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable identifier, e.g. `name_conflict`.
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
          description: '`fields` for `validation_error`.'
      required:
      - code
      - details
      - message
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        checks:
          type: object
          additionalProperties:
            enum:
            - ok
            - error
            type: string
            description: |-
              * `ok` - ok
              * `error` - error
      required:
      - checks
      - status
    KindEnum:
      enum:
      - folder
      - file
      type: string
      description: |-
        * `folder` - Folder
        * `file` - File
    LocaleEnum:
      enum:
      - vi
      - en
      type: string
      description: |-
        * `vi` - Tiếng Việt
        * `en` - Tiếng Anh
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        display_name:
          type: string
          title: Tên hiển thị
          maxLength: 100
        avatar_url:
          type: string
          readOnly: true
          nullable: true
          title: URL ảnh đại diện
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          title: Ngôn ngữ
        theme:
          allOf:
          - $ref: '#/components/schemas/ThemeEnum'
          title: Giao diện
      required:
      - avatar_url
      - email
      - id
    MoveRequest:
      type: object
      properties:
        node_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
          minItems: 1
        target_parent_id:
          type: string
          format: uuid
      required:
      - node_ids
      - target_parent_id
    MoveResult:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
      required:
      - nodes
    Node:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        parent_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_root:
          type: boolean
          readOnly: true
        size:
          type: integer
          readOnly: true
        mime_type:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_root
      - kind
      - mime_type
      - name
      - parent_id
      - size
      - updated_at
    NodeDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        parent_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        is_root:
          type: boolean
          readOnly: true
        size:
          type: integer
          readOnly: true
        mime_type:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        breadcrumb:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        capabilities:
          allOf:
          - $ref: '#/components/schemas/Capabilities'
          readOnly: true
      required:
      - breadcrumb
      - capabilities
      - created_at
      - id
      - is_root
      - kind
      - mime_type
      - name
      - parent_id
      - size
      - updated_at
    PaginatedNodeList:
      type: object
      required:
      - results
      - next
      - previous
      properties:
        next:
          type: string
          nullable: true
          format: uri
        previous:
          type: string
          nullable: true
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Node'
    PatchedMeRequest:
      type: object
      properties:
        display_name:
          type: string
          title: Tên hiển thị
          maxLength: 100
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          title: Ngôn ngữ
        theme:
          allOf:
          - $ref: '#/components/schemas/ThemeEnum'
          title: Giao diện
    PatchedRenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PublicConfig:
      type: object
      properties:
        turnstile_site_key:
          type: string
          nullable: true
          description: Cloudflare Turnstile site key; null when the server does not
            check it.
      required:
      - turnstile_site_key
    StatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    ThemeEnum:
      enum:
      - system
      - light
      - dark
      type: string
      description: |-
        * `system` - Theo hệ thống
        * `light` - Sáng
        * `dark` - Tối
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
