# Hạ tầng cho môi trường DEV. Backend và frontend chạy trực tiếp trên máy.
# Chuẩn bị: [ -f .env ] || cp .env.example .env  (rồi điền LOCALSTACK_AUTH_TOKEN)
# Cổng chỉ mở trên 127.0.0.1: tài khoản dev (qloud/qloud, Redis không mật khẩu) không lộ ra mạng LAN.
# Chạy:     docker compose up -d --wait

name: ${COMPOSE_PROJECT_NAME:-qloud}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qloud}
      POSTGRES_USER: ${POSTGRES_USER:-qloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qloud}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:2026.9.1
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env (see .env.example)}
      SERVICES: s3
      PERSISTENCE: "1"
      S3_BUCKET: ${S3_BUCKET:-qloud-dev}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      # Chỉ healthy khi init script đã xong: bucket dev, rồi CORS của bucket E2E (bước cuối)
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket $${S3_BUCKET} && awslocal s3api get-bucket-cors --bucket qloud-e2e"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  localstack-data:
